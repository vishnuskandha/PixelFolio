<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="CINEMATIC — FRAME 01 — placeholder">
  <defs>
    <radialGradient id="g1920x1080" cx="42%" cy="38%" r="95%">
      <stop offset="0%" stop-color="#1e120b"/>
      <stop offset="55%" stop-color="#070707"/>
      <stop offset="100%" stop-color="#060606"/>
    </radialGradient>
    <radialGradient id="g1920x1080-glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FF5C35" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FF5C35" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g1920x1080-band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2F0E8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F2F0E8" stop-opacity="0"/>
    </linearGradient>
    <filter id="g1920x1080-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="g1920x1080-soft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#g1920x1080)"/>
  <rect width="1920" height="1080" fill="url(#g1920x1080-glow)"/>

  <!-- ghost circle, gives the frame a subject-like focal form -->
  <circle cx="1190" cy="367" r="151"
          fill="url(#g1920x1080-band)" filter="url(#g1920x1080-soft)"/>
  <circle cx="1190" cy="367" r="151"
          fill="none" stroke="#F2F0E8" stroke-opacity="0.16" stroke-width="1"/>

  <rect width="1920" height="1080" filter="url(#g1920x1080-grain)"/>
  <rect x="1.5" y="1.5" width="1917" height="1077" fill="none" stroke="#F2F0E8" stroke-opacity="0.2"/>

  <text x="28" y="42" fill="#F2F0E8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3">CINEMATIC — FRAME 01</text>
  <text x="28" y="1058" fill="#8A8A84" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2">PLACEHOLDER — REPLACE WITH YOUR WORK</text>
  <text x="28" y="1040" fill="#8A8A84" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2">1920 × 1080</text>
</svg>
