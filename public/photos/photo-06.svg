<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1350" viewBox="0 0 900 1350" role="img" aria-label="PORTRAIT — 02 — placeholder">
  <defs>
    <radialGradient id="g900x1350" cx="42%" cy="38%" r="95%">
      <stop offset="0%" stop-color="#1c1410"/>
      <stop offset="55%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#060606"/>
    </radialGradient>
    <radialGradient id="g900x1350-glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FF5C35" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FF5C35" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g900x1350-band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2F0E8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F2F0E8" stop-opacity="0"/>
    </linearGradient>
    <filter id="g900x1350-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="g900x1350-soft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="900" height="1350" fill="url(#g900x1350)"/>
  <rect width="900" height="1350" fill="url(#g900x1350-glow)"/>

  <!-- ghost circle, gives the frame a subject-like focal form -->
  <circle cx="558" cy="459" r="126"
          fill="url(#g900x1350-band)" filter="url(#g900x1350-soft)"/>
  <circle cx="558" cy="459" r="126"
          fill="none" stroke="#F2F0E8" stroke-opacity="0.16" stroke-width="1"/>

  <rect width="900" height="1350" filter="url(#g900x1350-grain)"/>
  <rect x="1.5" y="1.5" width="897" height="1347" fill="none" stroke="#F2F0E8" stroke-opacity="0.2"/>

  <text x="28" y="42" fill="#F2F0E8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3">PORTRAIT — 02</text>
  <text x="28" y="1328" fill="#8A8A84" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2">PLACEHOLDER — REPLACE WITH YOUR WORK</text>
  <text x="28" y="1310" fill="#8A8A84" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2">900 × 1350</text>
</svg>
